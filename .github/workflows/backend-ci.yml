name: Java 21 Backend
on:
  push:
    paths: ['backend/**', 'scripts/qa/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'scripts/qa/**', '.github/workflows/backend-ci.yml']
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: QA-00 — Flyway version collision regression
        run: |
          python3 -m unittest discover -s scripts/qa -p 'test_check_flyway_versions.py'
          python3 scripts/qa/check_flyway_versions.py
      - run: mvn -B -f backend/pom.xml test
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: QA-00 — Flyway migration uniqueness preflight
        run: python3 scripts/qa/check_flyway_versions.py
      - run: mvn -B -f backend/pom.xml verify
      - name: QA-02 — measure actual JaCoCo line/branch coverage
        run: python3 scripts/qa/jacoco_report.py
      - name: Publish test and JaCoCo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/qa/
          if-no-files-found: warn
          retention-days: 7
