spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Signed tokens from trusted OIDC issuer, resource audience validated by Spring Security.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ZAKAZ_JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${ZAKAZ_JWT_AUDIENCE:zakaz-api}
