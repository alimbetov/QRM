spring.application.name=zakaz-backend
spring.profiles.default=dev
application.time-zone=Asia/Almaty
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
# Flyway is the single schema owner for PostgreSQL. Existing unversioned schemas
# are intentionally NOT automatically baselined.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
# SEARCH-S2 image ingestion is OFF unless explicitly enabled and a reviewed store is configured.
zakaz.catalog.media.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# SEARCH-S3 live photo-feed is OFF by default. Requires search enabled + cursor secret.
zakaz.catalog.feed.enabled=false
# S2B S3 provider requires HTTPS endpoint, private bucket, default credential chain.
zakaz.media.gc.enabled=false
# Per-instance protection against concurrent image decoder/RustFS memory pressure.
# This is not a distributed user rate limit; enable Redis only if measurements warrant it.
zakaz.media.upload.max-concurrent=2
# Production media upload requires ClamAV: zakaz.media.scanner.provider=clamav
# ML-R2 candidate evaluation is internal only. Never sends invitations or Push.
zakaz.ml.r2.invitation-evaluation.enabled=false
